name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential autoconf automake pkg-config \
            libncursesw5-dev libsqlite3-dev

      - name: Build and run tests (ASan/UBSan)
        run: |
          autoreconf -i
          ./configure --enable-sanitize --enable-werror
          make -j"$(nproc)"
          make -j"$(nproc)" check VERBOSE=yes

      - name: Upload config.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            config.log
            src/*.log
